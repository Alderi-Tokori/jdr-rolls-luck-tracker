[package]
name = "jdr-rolls-luck-calculator"
version = "0.1.0"
edition = "2024"

[dependencies]
turso = "0.6.1"
tokio = { version = "^1.52", features = ["full"] }
iced = { version = "0.14", features = ["canvas"] }
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
regex = "1.12.3"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
csv = "1.4.0"
rug = { version = "1.30.0", features = ["serde"] }

[dependencies.gmp-mpfr-sys]
version = "1.7.1"
features = ["c-no-tests"]